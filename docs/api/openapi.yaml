openapi: 3.1.0
info:
  title: Shop Mall API
  version: 1.0.0
  license:
    name: Proprietary
    identifier: internal
  description: |
    The single source of truth for the buyer and admin APIs.
    All timestamps are RFC3339 UTC. Points, prices, stock, and quantities are integers.
    Public int64 values are serialized as decimal strings to preserve precision in JavaScript.
    Administrator authentication uses admin_access_token with a 30-minute lifetime and
    attributes HttpOnly; Secure; SameSite=Strict; Path=/api/admin/v1. csrf_token is a
    Secure; SameSite=Strict; Path=/api/admin/v1 cookie readable by the frontend, but it
    is never an identity credential. The server rotates csrf_token at login, requires
    every administrator write's X-CSRF-Token to exactly match the csrf_token cookie,
    clears both cookies with Max-Age=0 and the same attributes on logout, and accepts
    writes only from an allowed HTTPS Origin. Missing or invalid Origin and missing or
    mismatched CSRF values return 403 with a CSRF/Origin error. Login is the only
    administrator write that does not require an existing CSRF token, but it still
    validates Origin and rate limits by username and IP.
servers:
  - url: https://api.shop-mall.invalid
    description: Deployment replaces this logical server URL with PUBLIC_BASE_URL.
tags:
  - name: buyer-auth
    description: Buyer authentication.
  - name: products
    description: Public product browsing.
  - name: buyer
    description: Authenticated buyer operations.
  - name: admin-auth
    description: Administrator authentication.
  - name: admin-products
    description: Administrator product management.
  - name: admin-orders
    description: Administrator order processing.
  - name: admin-refunds
    description: Administrator refund review.
  - name: admin-assets
    description: Administrator image uploads.
  - name: admin-access
    description: Administrator roles and permissions.
  - name: admin-points
    description: Administrator points adjustments.
  - name: operations
    description: Internal health checks.
paths:
  /health/live:
    get:
      tags: [operations]
      operationId: healthLive
      summary: Check process liveness
      security: []
      responses:
        '200':
          description: Process is alive.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /health/ready:
    get:
      tags: [operations]
      operationId: healthReady
      summary: Check dependency readiness
      security: []
      responses:
        '200':
          description: Dependencies are ready.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /metrics:
    get:
      tags: [operations]
      operationId: metrics
      summary: Expose Prometheus metrics
      description: Internal monitoring endpoint; network access control is required.
      security: []
      responses:
        '200':
          description: Prometheus text exposition format.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            text/plain:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/auth/wx-login:
    post:
      tags: [buyer-auth]
      operationId: wxLogin
      summary: Log in with a WeChat code
      description: The one-time WeChat code is consumed server-side and session_key is never persisted, returned, or logged.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WxLoginRequest'
      responses:
        '200':
          description: Buyer login succeeded.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuyerLoginResponse'
        '422':
          $ref: '#/components/responses/BusinessError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/products:
    get:
      tags: [products]
      operationId: listProducts
      summary: List products on sale
      description: Only products with status on_sale are returned. The category parameter restricts the result to one catalog key; keyword matches product names case-insensitively.
      security: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/ProductCategory'
        - $ref: '#/components/parameters/ProductKeyword'
      responses:
        '200':
          description: Products currently on sale, ordered by id descending.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/categories:
    get:
      tags: [products]
      operationId: listCategories
      summary: List the product category catalog
      description: The static category catalog paired with the live on-sale product count of each category.
      security: []
      responses:
        '200':
          description: Category catalog in display order.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryInfo'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/products/{productId}:
    get:
      tags: [products]
      operationId: getProduct
      summary: Get a public product
      description: A product with status off_sale is intentionally indistinguishable from a missing product and returns 404.
      security: []
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Product detail.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/me:
    get:
      tags: [buyer]
      operationId: getCurrentUser
      summary: Get the current buyer profile
      security:
        - UserBearer: []
      responses:
        '200':
          description: Current buyer profile.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags: [buyer]
      operationId: updateCurrentUser
      summary: Update the current buyer profile
      security:
        - UserBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: Profile updated.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/BusinessError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/me/avatar:
    post:
      tags: [buyer]
      operationId: uploadAvatar
      summary: Upload the current buyer's avatar
      description: Accepts a JPEG, PNG, or WebP image up to the platform upload limit. The object key is generated server-side; the stored object becomes the buyer's avatar_url immediately.
      security:
        - UserBearer: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Avatar stored and profile updated.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/BusinessError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/cart:
    get:
      tags: [buyer]
      operationId: getCart
      summary: Get the current buyer cart
      security:
        - UserBearer: []
      responses:
        '200':
          description: Current user's cart.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [buyer]
      operationId: addCartItem
      summary: Add a product to the cart
      security:
        - UserBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartItemCreateRequest'
      responses:
        '200':
          description: Cart item added.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartItemResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/BusinessError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/cart/{itemId}:
    patch:
      tags: [buyer]
      operationId: updateCartItem
      summary: Update a cart item quantity
      security:
        - UserBearer: []
      parameters:
        - $ref: '#/components/parameters/CartItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartItemUpdateRequest'
      responses:
        '200':
          description: Cart item updated.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartItemResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [buyer]
      operationId: deleteCartItem
      summary: Remove a cart item
      security:
        - UserBearer: []
      parameters:
        - $ref: '#/components/parameters/CartItemId'
      responses:
        '200':
          $ref: '#/components/responses/EmptySuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/addresses:
    get:
      tags: [buyer]
      operationId: listAddresses
      summary: List the current buyer addresses
      security:
        - UserBearer: []
      responses:
        '200':
          description: Current user's addresses.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [buyer]
      operationId: createAddress
      summary: Create a buyer address
      security:
        - UserBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressCreateRequest'
      responses:
        '201':
          description: Address created.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/BusinessError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/addresses/{addressId}:
    patch:
      tags: [buyer]
      operationId: updateAddress
      summary: Update a buyer address
      security:
        - UserBearer: []
      parameters:
        - $ref: '#/components/parameters/AddressId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressUpdateRequest'
      responses:
        '200':
          description: Address updated.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [buyer]
      operationId: deleteAddress
      summary: Delete a buyer address
      security:
        - UserBearer: []
      parameters:
        - $ref: '#/components/parameters/AddressId'
      responses:
        '200':
          $ref: '#/components/responses/EmptySuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/orders:
    get:
      tags: [buyer]
      operationId: listOrders
      summary: List the current buyer orders
      security:
        - UserBearer: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/OrderStatus'
      responses:
        '200':
          description: Current user's orders.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [buyer]
      operationId: createOrder
      summary: Create or replay an order idempotently
      description: |
        The server computes request_hash from the selected cart item IDs and quantities,
        address ID, the current address version, and the server-side address snapshot.
        It does not trust a client price or address snapshot. On successful creation,
        the selected cart items are deleted in the same database transaction as the
        order, inventory, points, and ledger changes. A replay with the same token and
        hash returns the original order without repeating side effects.
      security:
        - UserBearer: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreateRequest'
      responses:
        '200':
          description: Order created or idempotently replayed.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/BusinessError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/orders/{orderId}:
    get:
      tags: [buyer]
      operationId: getOrder
      summary: Get a buyer-owned order
      security:
        - UserBearer: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Current user's order detail.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/orders/{orderId}/refund:
    post:
      tags: [buyer]
      operationId: requestRefund
      summary: Request a refund for a buyer-owned order
      security:
        - UserBearer: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundRequest'
      responses:
        '200':
          description: Refund requested.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/orders/{orderId}/confirm:
    post:
      tags: [buyer]
      operationId: confirmOrder
      summary: Confirm receipt of a buyer-owned order
      security:
        - UserBearer: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Order confirmed.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/points/ledger:
    get:
      tags: [buyer]
      operationId: listPointsLedger
      summary: List the current buyer points ledger
      security:
        - UserBearer: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Current user's points ledger.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/admin/v1/auth/login:
    post:
      tags: [admin-auth]
      operationId: adminLogin
      summary: Log in an administrator
      description: |
        On success the server sets admin_access_token with a 30-minute lifetime and
        HttpOnly; Secure; SameSite=Strict; Path=/api/admin/v1. It also sets csrf_token as
        a Secure; SameSite=Strict; Path=/api/admin/v1 cookie readable by frontend code;
        csrf_token cannot authenticate the user and is rotated at every successful login.
        The login request is exempt from the CSRF header requirement because no session
        exists yet, but Origin must be an allowed HTTPS origin. Missing or invalid Origin
        returns 403 with a CSRF/Origin error.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLoginRequest'
      responses:
        '200':
          description: Login succeeded and sets admin_access_token and csrf_token cookies.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
            Set-Cookie:
              description: Sets admin_access_token with 30-minute Max-Age, HttpOnly; Secure; SameSite=Strict; Path=/api/admin/v1 and csrf_token with Secure; SameSite=Strict; Path=/api/admin/v1.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminLoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/admin/v1/auth/logout:
    post:
      tags: [admin-auth]
      operationId: adminLogout
      summary: Log out the current administrator
      description: |
        The server requires an allowed HTTPS Origin and an X-CSRF-Token value that exactly
        matches the csrf_token cookie, then clears admin_access_token and csrf_token with
        Max-Age=0 while preserving HttpOnly; Secure; SameSite=Strict; Path=/api/admin/v1.
        Missing or invalid Origin and missing or mismatched CSRF values return 403 with a
        CSRF/Origin error.
      security:
        - AdminCookie: []
          CsrfCookie: []
          CsrfToken: []
      x-required-permission: admin:self
      responses:
        '200':
          $ref: '#/components/responses/AdminLogoutSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/admin/v1/auth/password:
    post:
      tags: [admin-auth]
      operationId: changeAdminPassword
      summary: Change the current administrator password
      description: The request requires an allowed HTTPS Origin and an X-CSRF-Token value that exactly matches the csrf_token cookie. Missing or invalid Origin and missing or mismatched CSRF values return 403. A successful password change increments token_version and invalidates existing administrator JWTs.
      security:
        - AdminCookie: []
          CsrfCookie: []
          CsrfToken: []
      x-required-permission: admin:self
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
      responses:
        '200':
          $ref: '#/components/responses/EmptySuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/BusinessError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/admin/v1/products:
    get:
      tags: [admin-products]
      operationId: adminListProducts
      summary: List products for administrators
      security:
        - AdminCookie: []
      x-required-permission: product:read
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/ProductStatus'
      responses:
        '200':
          $ref: '#/components/responses/ProductListSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [admin-products]
