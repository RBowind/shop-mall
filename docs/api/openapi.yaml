        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    UserBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Buyer JWT. The token is sent in the Authorization header and is never stored in an administrator cookie.
    AdminCookie:
      type: apiKey
      in: cookie
      name: admin_access_token
      description: Administrator JWT cookie with a 30-minute lifetime and HttpOnly; Secure; SameSite=Strict; Path=/api/admin/v1. It is cleared on logout or token invalidation and cannot be read by frontend JavaScript.
    CsrfCookie:
      type: apiKey
      in: cookie
      name: csrf_token
      description: Secure; SameSite=Strict; Path=/api/admin/v1 CSRF cookie. Frontend JavaScript may read it to copy the value into X-CSRF-Token; it is not an identity credential and is rotated at login.
    CsrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Required on every administrator write except login. The value must exactly match the csrf_token cookie; missing or mismatched values return 403 with a CSRF error.
  headers:
    TraceId:
      description: Request trace identifier returned in the response body when the response uses the business envelope.
      required: true
      schema:
        type: string
        minLength: 1
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[1-9][0-9]*$'
        x-public-int64: true
        example: '1'
    CartItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[1-9][0-9]*$'
        x-public-int64: true
        example: '1'
    AddressId:
      name: addressId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[1-9][0-9]*$'
        x-public-int64: true
        example: '1'
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[1-9][0-9]*$'
        x-public-int64: true
        example: '1'
    RoleId:
      name: roleId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[1-9][0-9]*$'
        x-public-int64: true
        example: '1'
    AdminUserId:
      name: adminUserId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[1-9][0-9]*$'
        x-public-int64: true
        example: '1'
    OrderStatus:
      name: status
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/OrderStatus'
    ProductStatus:
      name: status
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/ProductStatus'
    ProductCategory:
      name: category
      in: query
      required: false
      description: Restrict the listing to one category catalog key; empty or absent means every category.
      schema:
        $ref: '#/components/schemas/CategoryKey'
    ProductKeyword:
      name: keyword
      in: query
      required: false
      description: Case-insensitive substring match against the product name.
      schema:
        type: string
        maxLength: 64
  responses:
    AdminLogoutSuccess:
      description: Logout succeeded and clears both administrator cookies.
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
        Set-Cookie:
          description: Clears admin_access_token and csrf_token with Max-Age=0 and HttpOnly; Secure; SameSite=Strict; Path=/api/admin/v1.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EmptyResponse'
    EmptySuccess:
      description: Operation succeeded.
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EmptyResponse'
    ProductSuccess:
      description: Product response.
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProductResponse'
    ProductListSuccess:
      description: Product list response.
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProductListResponse'
    OrderSuccess:
      description: Order response.
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OrderResponse'
    OrderListSuccess:
      description: Order list response.
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OrderListResponse'
    LedgerSuccess:
      description: Ledger response.
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LedgerResponse'
    RoleSuccess:
      description: Role response.
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RoleResponse'
    AdminUserSuccess:
      description: Administrator account response.
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminUserResponse'
    AdminUserListSuccess:
      description: Administrator account list response.
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminUserListResponse'
    Unauthorized:
      description: Authentication failed or token expired.
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authenticated but not permitted. This 403 also covers missing or invalid Origin and missing or mismatched X-CSRF-Token/csrf_token values.
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource does not exist or is not owned by the buyer.
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Idempotency or state transition conflict.
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BusinessError:
      description: Request is syntactically valid but violates business rules.
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Too many requests.
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PayloadTooLarge:
      description: Uploaded file is too large.
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnsupportedMediaType:
      description: File type is not supported.
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InsufficientStorage:
      description: Image storage is full.
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: Service is not ready.
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequest:
      description: Request syntax or parameter format is invalid.
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Unexpected server error. Internal details are not exposed.
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      required: [code, data, message, trace_id]
      properties:
        code:
          type: integer
          minimum: 1
          enum: [1001, 1002, 1003, 1004, 2001, 2002, 3001, 3002, 4001, 4002, 5001]
        data:
          type: 'null'
        message:
          type: string
        trace_id:
          type: string
          minLength: 1
    EmptyResponse:
      type: object
      required: [code, data, message, trace_id]
      properties:
        code:
          type: integer
          const: 0
        data:
          type: 'null'
        message:
          type: string
        trace_id:
          type: string
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, not_ready]
    PageMeta:
      type: object
      required: [list, total, page, page_size]
      properties:
        list:
          type: array
          items: {}
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
    User:
      type: object
      required: [id, nickname, avatar_url, points_balance]
      properties:
        id:
          type: string
          pattern: '^[1-9][0-9]*$'
          x-public-int64: true
          example: '1'
        nickname:
          type: string
          maxLength: 64
        avatar_url:
          type: string
          maxLength: 2048
        points_balance:
          type: string
          pattern: '^[0-9]+$'
          x-public-int64: true
          example: '1000'
    CategoryKey:
      type: string
      description: Stable category key from the catalog; empty means uncategorized.
      maxLength: 32
      example: digital
    CategoryInfo:
      type: object
      required: [id, name, product_count]
      properties:
        id:
          $ref: '#/components/schemas/CategoryKey'
        name:
          type: string
          description: Chinese display label of the category.
          example: 数码
        product_count:
          type: integer
          description: Live count of on-sale products in this category.
          minimum: 0
    Product:
      type: object
      required: [id, name, description, category, main_image, images, price_points, stock, status]
      properties:
        id:
          type: string
          pattern: '^[1-9][0-9]*$'
          x-public-int64: true
          example: '1'
        name:
          type: string
          maxLength: 128
        description:
          type: string
        category:
          $ref: '#/components/schemas/CategoryKey'
        main_image:
          type: string
          description: First gallery entry's public URL; kept for older clients. Empty when the product has no images.
        images:
          type: array
          description: Ordered gallery of public image URLs. Position 0 is the main image shown in listings and carts; blanks and duplicates never appear; at most 9 entries.
          maxItems: 9
          items:
            type: string
        price_points:
          type: string
          pattern: '^[1-9][0-9]*$'
          x-public-int64: true
          example: '100'
        stock:
          type: integer
          minimum: 0
        status:
          $ref: '#/components/schemas/ProductStatus'
    ProductStatus:
      type: string
      enum: [on_sale, off_sale]
    ProductWriteRequest:
      type: object
      required: [name, price_points, stock]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        description:
          type: string
        category:
          description: Stable category key; empty or absent means uncategorized. Unknown keys are rejected with 422.
          $ref: '#/components/schemas/CategoryKey'
        images:
          type: array
          description: Full replacement gallery of previously uploaded image object keys, ordered (position 0 = main image). Blanks are dropped and duplicates collapse server-side; more than 9 entries is rejected with 422. An absent field on PATCH keeps the current gallery; an empty array clears it.
          maxItems: 9
          items:
            type: string
        price_points:
          type: string
          pattern: '^[1-9][0-9]*$'
          x-public-int64: true
          example: '100'
        stock:
          type: integer
          minimum: 0
        status:
          $ref: '#/components/schemas/ProductStatus'
    CartItem:
      type: object
      required: [id, product_id, quantity, product]
      properties:
        id:
          type: string
          pattern: '^[1-9][0-9]*$'
          x-public-int64: true
          example: '1'
        product_id:
          type: string
          pattern: '^[1-9][0-9]*$'
          x-public-int64: true
          example: '1'
        quantity:
          type: integer
          minimum: 1
        product:
          $ref: '#/components/schemas/Product'
    Address:
      type: object
      required: [id, receiver, phone, region, detail, is_default, version]
      properties:
        id:
          type: string
          pattern: '^[1-9][0-9]*$'
          x-public-int64: true
          example: '1'
        receiver:
          type: string
          maxLength: 32
        phone:
          type: string
          maxLength: 20
        region:
          type: string
          maxLength: 64
        detail:
          type: string
          maxLength: 255
        is_default:
          type: boolean
        version:
          type: string
          pattern: '^[1-9][0-9]*$'
          x-public-int64: true
          description: Optimistic-concurrency version. It is included in the server-side order request hash.
          example: '3'
    OrderStatus:
      type: string
      enum: [paid, shipped, completed, refund_requested, refunded]
    OrderItem:
      type: object
      required: [product_id, product_name, product_image, price_snapshot, quantity]
      properties:
        product_id:
          type: string
          pattern: '^[1-9][0-9]*$'
          x-public-int64: true
          example: '1'
        product_name:
          type: string
        product_image:
          type: string
        price_snapshot:
          type: string
          pattern: '^[1-9][0-9]*$'
          x-public-int64: true
          example: '100'
        quantity:
          type: integer
          minimum: 1
    Order:
      type: object
      required: [id, order_no, status, total_points, receiver, phone, address, items, paid_at, shipped_at, completed_at, refunded_at, created_at]
      properties:
        id:
          type: string
          pattern: '^[1-9][0-9]*$'
          x-public-int64: true
          example: '1'
        order_no:
          type: string
        status:
          $ref: '#/components/schemas/OrderStatus'
        total_points:
          type: string
          pattern: '^[1-9][0-9]*$'
          x-public-int64: true
          example: '200'
        receiver:
          type: string
        phone:
          type: string
        address:
          type: string
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderItem'
        paid_at:
          type: string
          format: date-time
        shipped_at:
          type: [string, 'null']
          format: date-time
        completed_at:
          type: [string, 'null']
          format: date-time
        refunded_at:
          type: [string, 'null']
          format: date-time
        refund_reason:
          type: string
        refund_reject_reason:
          type: string
        created_at:
          type: string
          format: date-time
    LedgerEntry:
      type: object
      required: [id, type, delta, balance_after, remark, created_at]
      properties:
        id:
          type: string
          pattern: '^[1-9][0-9]*$'
          x-public-int64: true
          example: '1'
        order_id:
          type: [string, 'null']
          pattern: '^[1-9][0-9]*$'
          x-public-int64: true
          example: '1'
        type:
          type: string
          enum: [order_pay, order_refund, signup_bonus, admin_adjust]
        delta:
          type: string
          pattern: '^-?[0-9]+$'
          x-public-int64: true
          x-public-int64-signed: true
          example: '-100'
        balance_after:
          type: string
          pattern: '^[0-9]+$'
          x-public-int64: true
          example: '900'
        remark:
          type: string
        created_at:
          type: string
          format: date-time
    Role:
      type: object
      required: [id, name, permissions]
      properties:
        id:
          type: string
          pattern: '^[1-9][0-9]*$'
          x-public-int64: true
          example: '1'
        name:
          type: string
        permissions:
          type: array
          items:
            type: string
    RoleResponse:
      type: object
      required: [code, data, message, trace_id]
      properties:
        code:
          type: integer
          const: 0
        data:
          $ref: '#/components/schemas/Role'
        message:
          type: string
        trace_id:
          type: string
    AdminUserResponse:
      type: object
      required: [code, data, message, trace_id]
      properties:
        code:
          type: integer
          const: 0
        data:
          $ref: '#/components/schemas/AdminUser'
        message:
          type: string
        trace_id:
          type: string
    AdminUserListResponse:
      type: object
      required: [code, data, message, trace_id]
      properties:
        code:
          type: integer
          const: 0
        data:
          allOf:
            - $ref: '#/components/schemas/PageMeta'
            - type: object
              properties:
                list:
                  type: array
                  items:
                    $ref: '#/components/schemas/AdminUser'
        message:
          type: string
        trace_id:
          type: string
    RoleWriteRequest:
      type: object
      required: [name, permissions]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 32
        permissions:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 64
    RoleUpdateRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 32
        permissions:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 64
    AdminUser:
      type: object
      required: [id, username, enabled, role]
      properties:
        id:
          type: string
          pattern: '^[1-9][0-9]*$'
          x-public-int64: true
          example: '1'
        username:
          type: string
        enabled:
          type: boolean
        role:
          $ref: '#/components/schemas/Role'
    AdminUserUpdateRequest:
      type: object
      minProperties: 1
      properties:
        enabled:
          type: boolean
        role_id:
          type: string
          pattern: '^[1-9][0-9]*$'
          x-public-int64: true
          example: '1'
    WxLoginRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 512
    BuyerLoginResponse:
      type: object
      required: [code, data, message, trace_id]
      properties:
        code:
          type: integer
          const: 0
        data:
          type: object
          required: [access_token, user]
          properties:
            access_token:
              type: string
            user:
              $ref: '#/components/schemas/User'
        message:
          type: string
        trace_id:
          type: string
    AdminLoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 32
        password:
          type: string
          minLength: 12
          maxLength: 128
    AdminLoginResponse:
      type: object
      required: [code, data, message, trace_id]
      properties:
        code:
          type: integer
          const: 0
        data:
          type: object
          required: [admin_id, username, role]
          properties:
            admin_id:
              type: string
              pattern: '^[1-9][0-9]*$'
              x-public-int64: true
              example: '1'
            username:
              type: string
            role:
              $ref: '#/components/schemas/Role'
        message:
          type: string
        trace_id:
          type: string
    PasswordChangeRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          minLength: 1
          maxLength: 128
        new_password:
          type: string
          minLength: 12
          maxLength: 128
    UserUpdateRequest:
      type: object
      properties:
        nickname:
          type: string
          maxLength: 64
        avatar_url:
          type: string
          maxLength: 2048
    CartItemCreateRequest:
      type: object
      required: [product_id, quantity]
      properties:
        product_id:
          type: string
          pattern: '^[1-9][0-9]*$'
          x-public-int64: true
          example: '1'
        quantity:
          type: integer
          minimum: 1
    CartItemUpdateRequest:
      type: object
      required: [quantity]
      properties:
        quantity:
          type: integer
          minimum: 1
    AddressCreateRequest:
      type: object
      required: [receiver, phone, region, detail]
      properties:
        receiver:
          type: string
          minLength: 1
          maxLength: 32
        phone:
          type: string
          minLength: 6
          maxLength: 20
        region:
          type: string
          minLength: 1
          maxLength: 64
        detail:
          type: string
          minLength: 1
          maxLength: 255
        is_default:
          type: boolean
          default: false
    AddressUpdateRequest:
      type: object
      properties:
        receiver:
          type: string
          minLength: 1
          maxLength: 32
        phone:
          type: string
          minLength: 6
          maxLength: 20
        region:
          type: string
          minLength: 1
          maxLength: 64
        detail:
          type: string
          minLength: 1
          maxLength: 255
        is_default:
          type: boolean
    OrderCreateRequest:
      type: object
      required: [cart_item_ids, address_id]
      properties:
        cart_item_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            pattern: '^[1-9][0-9]*$'
            x-public-int64: true
            example: '1'
        address_id:
          type: string
          pattern: '^[1-9][0-9]*$'
          x-public-int64: true
          example: '1'
    RefundRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 255
    RefundRejectRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 255
    PointsAdjustRequest:
      type: object
      required: [user_id, delta, remark]
      properties:
        user_id:
          type: string
          pattern: '^[1-9][0-9]*$'
          x-public-int64: true
          example: '1'
        delta:
          type: string
          pattern: '^-?[1-9][0-9]*$'
          x-public-int64: true
          x-public-int64-signed: true
          example: '100'
        remark:
          type: string
          minLength: 1
          maxLength: 255
    ImageResponse:
      type: object
      required: [key, url, width, height, size]
      properties:
        key:
          type: string
        url:
          type: string
          format: uri
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
    ProductResponse:
      type: object
      required: [code, data, message, trace_id]
      properties:
        code:
          type: integer
          const: 0
        data:
          $ref: '#/components/schemas/Product'
        message:
          type: string
        trace_id:
          type: string
    ProductListResponse:
      type: object
      required: [code, data, message, trace_id]
      properties:
        code:
          type: integer
          const: 0
        data:
          allOf:
            - $ref: '#/components/schemas/PageMeta'
            - type: object
              properties:
                list:
                  type: array
                  items:
                    $ref: '#/components/schemas/Product'
        message:
          type: string
        trace_id:
          type: string
    UserResponse:
      type: object
      required: [code, data, message, trace_id]
      properties:
        code:
          type: integer
          const: 0
        data:
          $ref: '#/components/schemas/User'
        message:
          type: string
        trace_id:
          type: string
    CartItemResponse:
      type: object
      required: [code, data, message, trace_id]
      properties:
        code:
          type: integer
          const: 0
        data:
          $ref: '#/components/schemas/CartItem'
        message:
          type: string
        trace_id:
          type: string
    CartResponse:
      type: object
      required: [code, data, message, trace_id]
      properties:
        code:
          type: integer
          const: 0
        data:
          type: object
          required: [list]
          properties:
            list:
              type: array
              items:
                $ref: '#/components/schemas/CartItem'
        message:
          type: string
        trace_id:
          type: string
    AddressResponse:
      type: object
      required: [code, data, message, trace_id]
      properties:
        code:
          type: integer
          const: 0
        data:
          $ref: '#/components/schemas/Address'
        message:
          type: string
        trace_id:
          type: string
    AddressListResponse:
      type: object
      required: [code, data, message, trace_id]
      properties:
        code:
          type: integer
          const: 0
        data:
          type: object
          required: [list]
          properties:
            list:
              type: array
              items:
                $ref: '#/components/schemas/Address'
        message:
          type: string
        trace_id:
          type: string
    OrderResponse:
      type: object
      required: [code, data, message, trace_id]
      properties:
        code:
          type: integer
          const: 0
        data:
          $ref: '#/components/schemas/Order'
        message:
          type: string
        trace_id:
          type: string
    OrderListResponse:
      type: object
      required: [code, data, message, trace_id]
      properties:
        code:
          type: integer
          const: 0
        data:
          allOf:
            - $ref: '#/components/schemas/PageMeta'
            - type: object
              properties:
                list:
                  type: array
                  items:
                    $ref: '#/components/schemas/Order'
        message:
          type: string
        trace_id:
          type: string
    LedgerResponse:
      type: object
      required: [code, data, message, trace_id]
      properties:
        code:
          type: integer
          const: 0
        data:
          $ref: '#/components/schemas/LedgerEntry'
        message:
          type: string
        trace_id:
          type: string
    LedgerListResponse:
      type: object
      required: [code, data, message, trace_id]
      properties:
        code:
          type: integer
          const: 0
        data:
          allOf:
            - $ref: '#/components/schemas/PageMeta'
            - type: object
              properties:
                list:
                  type: array
                  items:
                    $ref: '#/components/schemas/LedgerEntry'
        message:
          type: string
        trace_id:
          type: string
    RoleListResponse:
      type: object
      required: [code, data, message, trace_id]
      properties:
        code:
          type: integer
          const: 0
        data:
          type: object
          required: [list]
          properties:
            list:
              type: array
              items:
                $ref: '#/components/schemas/Role'
        message:
          type: string
        trace_id:
          type: string
