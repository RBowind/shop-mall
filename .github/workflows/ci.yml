name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.27.x

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Check OpenAPI contract
        run: make contract-check

  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.27.x
          cache-dependency-path: backend/go.sum

      - name: Test backend
        run: cd backend && go test ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and check frontend packages
        run: make frontend-checks

  deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.27.x

      - name: Validate Compose and migration configuration
        run: make migration-config-check

      - name: Run migration service
        run: docker compose -f deploy/compose/docker-compose.yml run --rm migration-test

      - name: Build backend image
        run: make image-build

      - name: Clean up migration services
        if: always()
        run: docker compose -f deploy/compose/docker-compose.yml down --volumes --remove-orphans
