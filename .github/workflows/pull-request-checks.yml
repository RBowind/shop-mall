name: Pull Request Checks

# 合门前检查：contract / backend / frontend / coverage 四道，加上
# release-artifacts.yml 里的 deployment，共五道 required checks。
# coverage 只在 pull_request 事件跑（改动行口径依赖 base 分支）。
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Check OpenAPI contract
        run: make contract-check

  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.27.x
          cache-dependency-path: backend/go.sum

      - name: Test backend
        run: cd backend && go test ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and check frontend packages
        run: make frontend-checks

  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.27.x
          cache-dependency-path: backend/go.sum

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install diff-cover
        run: pip install diff-cover==10.5.1

      # PR 上对比 base 分支挡合并；push main 上对比上一个提交做主干体检，
      # 两种事件都产出 coverage 检查，分支保护下拉里才选得到它。
      - name: Changed-line coverage gate (>= 80%)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            make diff-coverage COMPARE="origin/${{ github.base_ref }}"
          else
            make diff-coverage COMPARE="HEAD^1"
          fi
