events {}

http {
    server_tokens off;
    client_max_body_size 2m;

    include /etc/nginx/mime.types;

    upstream shop_mall_app {
        server app:8080;
    }

    server {
        listen 80;
        server_name _;
        return 308 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name _;

        # Deployment must replace these placeholders with a trusted certificate.
        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        location /api/ {
            proxy_pass http://shop_mall_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        location /static/images/ {
            alias /var/lib/shop-mall/images/;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location = /health/live {
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
            proxy_pass http://shop_mall_app;
        }

        location = /health/ready {
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
            proxy_pass http://shop_mall_app;
        }

        location = /metrics {
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
            proxy_pass http://shop_mall_app;
        }

        # Robots.txt is intentionally absent for an authenticated admin
        # console; return 404 instead of letting the SPA fallback answer it
        # with index.html (which would also break Lighthouse SEO checks).
        location = /robots.txt {
            return 404;
        }

        # Admin SPA: serve the esbuild bundle from the admin dist directory
        # mounted into the container. The hash router keeps state in the URL
        # fragment, so any non-file URI falls through to index.html to survive
        # a refresh at e.g. #/products. index.html and the fixed-name assets
        # are served with no-cache so a redeploy is picked up immediately.
        location / {
            root /usr/share/nginx/html/admin;
            add_header Cache-Control "no-cache";
            try_files $uri $uri/ /index.html;
        }
    }
}
