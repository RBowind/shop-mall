services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shop_mall}
      POSTGRES_USER: ${POSTGRES_USER:-shop_mall}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-__SET_IN_ENV__}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks:
      - backend

  app:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    image: ${APP_IMAGE:-shop-mall-app:local}
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      HTTP_ADDR: ${HTTP_ADDR:-:8080}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://api.invalid}
      ADMIN_ALLOWED_ORIGINS: ${ADMIN_ALLOWED_ORIGINS:-https://admin.invalid}
      DATABASE_URL: postgres://${POSTGRES_USER:-shop_mall}:${POSTGRES_PASSWORD:-__SET_IN_ENV__}@postgres:5432/${POSTGRES_DB:-shop_mall}?sslmode=${POSTGRES_SSLMODE:-disable}&client_encoding=UTF8
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-20}
      DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-10}
      DB_CONN_MAX_LIFETIME: ${DB_CONN_MAX_LIFETIME:-30m}
      DB_CONN_MAX_IDLE_TIME: ${DB_CONN_MAX_IDLE_TIME:-5m}
      BUYER_JWT_ISSUER: ${BUYER_JWT_ISSUER:-__SET_IN_ENV__}
      BUYER_JWT_AUDIENCE: ${BUYER_JWT_AUDIENCE:-__SET_IN_ENV__}
      BUYER_JWT_ACTIVE_KID: ${BUYER_JWT_ACTIVE_KID:-__SET_IN_ENV__}
      BUYER_JWT_KEYRING: ${BUYER_JWT_KEYRING:-__SET_IN_ENV__}
      BUYER_JWT_TTL: ${BUYER_JWT_TTL:-24h}
      ADMIN_JWT_ISSUER: ${ADMIN_JWT_ISSUER:-__SET_IN_ENV__}
      ADMIN_JWT_AUDIENCE: ${ADMIN_JWT_AUDIENCE:-__SET_IN_ENV__}
      ADMIN_JWT_ACTIVE_KID: ${ADMIN_JWT_ACTIVE_KID:-__SET_IN_ENV__}
      ADMIN_JWT_KEYRING: ${ADMIN_JWT_KEYRING:-__SET_IN_ENV__}
      ADMIN_JWT_TTL: ${ADMIN_JWT_TTL:-30m}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-2097152}
      SIGNUP_BONUS_POINTS: ${SIGNUP_BONUS_POINTS:-100}
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
      WECHAT_ENDPOINT: ${WECHAT_ENDPOINT:-}
      IMAGE_MAX_PIXELS: ${IMAGE_MAX_PIXELS:-25000000}
      IMAGE_STORAGE_CAPACITY_BYTES: ${IMAGE_STORAGE_CAPACITY_BYTES:-10737418240}
      IMAGE_GRACE_PERIOD: ${IMAGE_GRACE_PERIOD:-24h}
      IMAGE_CLEANUP_INTERVAL: ${IMAGE_CLEANUP_INTERVAL:-1h}
      IMAGE_VOLUME_DIR: ${IMAGE_VOLUME_DIR:-/var/lib/shop-mall/images}
    expose:
      - "8080"
    volumes:
      - images:/var/lib/shop-mall/images
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health/ready >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - edge
      - backend

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - images:/var/lib/shop-mall/images:ro
      - ../../admin/dist:/usr/share/nginx/html/admin:ro
      - ${NGINX_CERT_DIR:-../../deploy/env/certs}:/etc/nginx/certs:ro
    depends_on:
      app:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -qO- https://127.0.0.1/health/live >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - edge

  prometheus:
    image: prom/prometheus:v2.53.2
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ../prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    depends_on:
      app:
        condition: service_healthy
        restart: true
    ports:
      # Host loopback only: the dashboard is for local debugging and must not
      # be reachable from the public network.
      - "${PROMETHEUS_HTTP_PORT:-127.0.0.1:9090}:9090"
    networks:
      - backend

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    volumes:
      - ../alertmanager:/etc/alertmanager:ro
    depends_on:
      prometheus:
        condition: service_started
    ports:
      - "${ALERTMANAGER_HTTP_PORT:-127.0.0.1:9093}:9093"
    networks:
      - backend

  migration-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shop_mall_migration_test
      POSTGRES_USER: migration_test
      POSTGRES_HOST_AUTH_METHOD: trust
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U migration_test -d shop_mall_migration_test"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 2s
    networks:
      - migration

  migration-test:
    image: postgres:16-alpine
    restart: "no"
    depends_on:
      migration-postgres:
        condition: service_healthy
    volumes:
      - ../../backend/migrations:/migrations:ro
    command:
      - sh
      - -ec
      - |
        psql -h migration-postgres -U migration_test -d shop_mall_migration_test -v ON_ERROR_STOP=1 -f /migrations/0001_init.up.sql
        psql -h migration-postgres -U migration_test -d shop_mall_migration_test -v ON_ERROR_STOP=1 -f /migrations/0002_seed.up.sql
    networks:
      - migration

volumes:
  postgres-data:
  images:
  prometheus-data:

networks:
  edge:
  backend:
    internal: true
  migration:
    internal: true
