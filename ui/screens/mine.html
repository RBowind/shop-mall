<!doctype html>
<!-- 积分商城小程序原型 · 我的（tab 4：头像、余额、订单入口、地址/规则） -->
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>我的 · 积分商城</title>
<link rel="stylesheet" href="../assets/app.css" />
</head>
<body class="stage">
  <span class="stage-label">04 · 我的 — tab 4</span>
  <div class="phone"><div class="screen" data-od-id="screen-mine">
    <div id="chrome-top"></div>

    <div class="body" style="padding: 0;">
      <!-- 用户头卡 -->
      <section data-od-id="profile-head" style="background: linear-gradient(180deg, color-mix(in oklch, var(--accent) 14%, var(--surface)), var(--bg) 90%); padding: 20px 16px 16px; text-align:center;">
        <span class="avatar" style="width: 64px; height: 64px; font-size: 26px; margin: 0 auto; box-shadow: 0 0 0 4px var(--surface);">雨</span>
        <div style="font-size: 16px; font-weight: 700; margin-top: 8px;">雨天的小店</div>
        <div style="font-size: 12px; color: var(--fg-6); margin-top: 2px;">2026-07-01 加入 · 首次登录赠送 100 积分</div>
        <a href="points.html" class="points-pill" data-od-id="mine-balance" style="
            display:inline-flex; align-items:baseline; gap:6px; margin-top: 14px; padding: 10px 22px;
            background: var(--surface); border-radius: 999px; text-decoration:none; color: var(--fg);
            box-shadow: 0 4px 14px color-mix(in oklch, var(--fg) 8%, transparent);">
          <span style="font-size:12px; color:var(--muted);">积分余额</span>
          <span class="tnum" id="balance" style="font-size: 22px; font-weight: 800; color: var(--accent);"></span>
          <span id="chev" style="display:inline-flex;color:var(--fg-4);align-self:center;"></span>
        </a>
      </section>

      <!-- 订单入口 -->
      <section class="cell-group block" data-od-id="mine-orders" style="margin: 0 12px;">
        <a class="cell" href="orders.html?status=paid" data-od-id="cell-orders-paid">
          <span class="cell-icon" id="i1"></span>
          <span class="cell-main"><span class="cell-title">兑换订单</span></span>
          <span class="cell-value" id="orders-count"></span>
          <span class="chev" id="c1"></span>
        </a>
      </section>

      <!-- 功能列表 -->
      <section class="cell-group block" data-od-id="mine-cells" style="margin: 12px;">
        <a class="cell" href="points.html" data-od-id="cell-points">
          <span class="cell-icon" id="i2"></span>
          <span class="cell-main"><span class="cell-title">我的积分</span><span class="cell-sub">收支流水 · 积分规则</span></span>
          <span class="chev" id="c2"></span>
        </a>
        <button class="cell" data-od-id="cell-address" onclick="PS.toast('原型示意：地址管理在真实小程序中已实现')">
          <span class="cell-icon" id="i3"></span>
          <span class="cell-main"><span class="cell-title">收货地址</span><span class="cell-sub">2 个地址 · 默认已设置</span></span>
          <span class="chev" id="c3"></span>
        </button>
        <button class="cell" data-od-id="cell-service" onclick="PS.toast('微信客服组件为真实实现，原型暂示意')">
          <span class="cell-icon" id="i4"></span>
          <span class="cell-main"><span class="cell-title">联系客服</span></span>
          <span class="chev" id="c4"></span>
        </button>
      </section>

      <p class="muted" style="text-align:center; font-size: 11px; padding: 8px 0 24px;">shop-mall · Taro + TDesign 小程序 · 原型示意数据</p>
    </div>

    <div id="chrome-tab"></div>
    <div class="home-indicator"></div>
  </div></div>

  <script src="../assets/app.js"></script>
  <script>
    PS.chrome({ title: '我的', tab: 'mine' });
    document.getElementById('balance').textContent = PS.fmt(PS.getBalance());
    document.getElementById('chev').innerHTML = PS.icon('chev', 13);
    var pend = PS.getOrders().filter(function (o) { return o.status === 'paid' || o.status === 'shipped'; }).length;
    document.getElementById('orders-count').textContent = pend ? pend + ' 个进行中' : '暂无进行中';
    ['i1','i2','i3','i4'].forEach(function (id, i) { document.getElementById(id).innerHTML = PS.icon(['doc','coin','pin','headset'][i], 17); });
    ['c1','c2','c3','c4'].forEach(function (id) { document.getElementById(id).innerHTML = PS.icon('chev', 14); });
  </script>
</body>
</html>
